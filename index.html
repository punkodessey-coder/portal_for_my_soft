<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131f"><title>My Portal</title>
<style>
:root{color-scheme:dark;--fg:#f7f8ff;--muted:#a9afc8;--line:#ffffff22;--glass:#ffffff0d;--accent:#aaa4ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--fg);font:15px/1.45 Inter,system-ui,sans-serif;background:radial-gradient(ellipse at 15% 5%,#6255bf55,transparent 36%),radial-gradient(ellipse at 85% 18%,#278bab44,transparent 32%),#10131f;background-attachment:fixed}.shell{width:min(1150px,calc(100% - 32px));margin:auto;padding:26px 0 40px}.glass{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(22px);box-shadow:0 12px 40px #0002,inset 0 1px #ffffff10}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:55px;gap:14px}.brand{display:flex;align-items:center;gap:12px;font-weight:750}.mark{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;border:1px solid var(--line);background:#ffffff15;font-size:22px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#ffffff0d;color:inherit;cursor:pointer}.btn:hover{background:#ffffff20}.primary{background:linear-gradient(135deg,#918aff,#706ce0)}.hero{text-align:center;margin-bottom:34px}.eyebrow{color:#c2beff;text-transform:uppercase;letter-spacing:3px;font-size:11px}.clock{font-size:clamp(44px,7vw,68px);font-weight:650;letter-spacing:-3px;margin:9px 0 2px}.date{color:var(--muted);margin-bottom:28px;text-transform:capitalize}.search{width:min(640px,100%);margin:auto;position:relative}.search input{width:100%;padding:17px 48px;border-radius:18px;border:1px solid var(--line);outline:none;color:var(--fg);background:#ffffff10;font:inherit}.search input:focus{border-color:#aaa4ff99;box-shadow:0 0 0 4px #aaa4ff18}.search .mag{position:absolute;left:17px;top:13px;font-size:20px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:42px 0 16px}.sectionhead h2{font-size:17px;margin:0}.sectionhead p{font-size:12px;color:var(--muted);margin:4px 0}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.chip{border:1px solid var(--line);border-radius:99px;padding:7px 13px;background:#ffffff08;color:#d2d4e5;cursor:pointer}.chip.active,.chip:hover{background:#aaa4ff30;border-color:#aaa4ff70}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.card{position:relative;min-height:148px;border-radius:20px;padding:17px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:.2s}.card:hover{transform:translateY(-4px);background:#ffffff17}.card>a{position:absolute;inset:0;z-index:1}.appicon{width:55px;height:55px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#ffffff27,#ffffff08);border:1px solid var(--line);font-size:26px;margin-bottom:10px}.appname{font-size:13px;font-weight:650;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cat{font-size:11px;color:var(--muted);margin-top:4px}.cardactions{position:absolute;right:6px;top:6px;z-index:2;display:flex;gap:4px;opacity:0}.card:hover .cardactions{opacity:1}.iconbtn{border:1px solid var(--line);border-radius:7px;background:#171a2ddd;color:white;cursor:pointer}.empty{grid-column:1/-1;padding:40px;text-align:center;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}footer{display:flex;justify-content:space-between;gap:12px;margin-top:42px;padding-top:16px;border-top:1px solid #ffffff14;color:#858ba4;font-size:12px}footer button{background:none;border:0;color:var(--accent);cursor:pointer}.backdrop{display:none;position:fixed;inset:0;z-index:5;background:#05070fc9;backdrop-filter:blur(8px);place-items:center;padding:16px}.backdrop.open{display:grid}.modal{width:min(470px,100%);padding:24px;border-radius:22px}.modal h2{margin:0 0 5px}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}.field{display:block;margin:13px 0}.field span{display:block;font-size:12px;color:#c8cbe0;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#151827;color:white;font:inherit}.emojis{display:flex;gap:6px;flex-wrap:wrap}.emoji{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#ffffff0c;font-size:18px;cursor:pointer}.emoji.selected{border-color:var(--accent);background:#aaa4ff30}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#25283b;border:1px solid var(--line);border-radius:12px;padding:11px 16px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:950px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:620px){.shell{width:calc(100% - 24px);padding-top:17px}header{margin-bottom:38px}.brand small{display:none}.btn{padding:9px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{min-height:130px;padding:14px 6px}.appicon{width:49px;height:49px}.cardactions{opacity:1}footer{flex-direction:column}}@media(max-width:380px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main class="shell">
<header><div class="brand"><div class="mark">✦</div><div>My Portal<small>ТВОЁ ПРОСТРАНСТВО</small></div></div><div class="actions"><button class="btn" id="export">↧ Экспорт</button><button class="btn primary" id="add">＋ Добавить</button></div></header>
<section class="hero"><div class="eyebrow">Всё нужное — под рукой</div><div class="clock" id="clock">00:00</div><div class="date" id="date"></div><div class="search"><span class="mag">⌕</span><input id="query" type="search" placeholder="Найти приложение…" autocomplete="off"></div></section>
<section><div class="sectionhead"><div><h2>Быстрый доступ</h2><p id="count"></p></div><button class="btn" id="import">↥ Импорт</button><input hidden id="file" type="file" accept=".json,application/json"></div><div class="chips" id="chips"></div><div class="grid" id="grid"></div></section>
<footer><span>MY PORTAL <span id="year"></span> · Персональная стартовая страница</span><span>Сохранение в браузере · <button id="reset">Сбросить демо-данные</button></span></footer>
</main><div class="backdrop" id="backdrop"><form class="modal glass" id="form"><h2 id="formtitle">Новое приложение</h2><p class="sub">Добавь сайт или свой веб-инструмент.</p><input type="hidden" id="id"><label class="field"><span>Название *</span><input id="name" required maxlength="50" placeholder="Мой инструмент"></label><label class="field"><span>Ссылка *</span><input id="url" required placeholder="https://example.com"></label><label class="field"><span>Категория</span><select id="category"><option>Работа</option><option>Разработка</option><option>Инструменты</option><option>Медиа</option><option>Обучение</option><option>Другое</option></select></label><div class="field"><span>Иконка</span><div class="emojis" id="emojis"></div></div><div class="modalactions"><button class="btn" type="button" id="cancel">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></form></div><div class="toast" id="toast"></div>
<script>
const KEY='my-portal-apps-v1',icons=['🚀','💻','🧰','⚙️','🌐','📁','🧠','✨','🎨','📝','📊','🎮','🎧','📷','🔧','🐙','✳️','🔗','📌','⭐','🗂️','🧪','🛠️','📦'];
const seed=[['github','GitHub','https://github.com','Разработка','🐙'],['chatgpt','ChatGPT','https://chatgpt.com','Инструменты','✳️'],['youtube','YouTube','https://youtube.com','Медиа','▶️'],['drive','Google Drive','https://drive.google.com','Работа','📁'],['stack','Stack Overflow','https://stackoverflow.com','Разработка','🧩'],['notion','Notion','https://notion.so','Работа','◻️'],['figma','Figma','https://figma.com','Инструменты','🎨'],['docs','Документы','https://docs.google.com','Работа','📝'],['stepik','Stepik','https://stepik.org','Обучение','🎓'],['spotify','Spotify','https://open.spotify.com','Медиа','🎧'],['replit','Replit','https://replit.com','Разработка','⌘'],['photopea','Photopea','https://photopea.com','Инструменты','🖼️']].map(a=>({id:a[0],name:a[1],url:a[2],category:a[3],icon:a[4]}));
let apps=load(),active='Все',q='',chosen='🚀';
function load(){try{let a=JSON.parse(localStorage.getItem(KEY));return Array.isArray(a)?a:seed.map(x=>({...x}))}catch{return seed.map(x=>({...x}))}}
function save(){localStorage.setItem(KEY,JSON.stringify(apps))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(s){s=s.trim();if(!/^[a-z][a-z\d+.-]*:/i.test(s))s='https://'+s;try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function render(){let cats=['Все',...new Set(apps.map(a=>a.category||'Другое'))];if(!cats.includes(active))active='Все';document.getElementById('chips').innerHTML=cats.map(c=>'<button class="chip '+(c===active?'active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()});let list=apps.filter(a=>(active==='Все'||a.category===active)&&[a.name,a.category,a.url].join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('count').textContent=apps.length+' приложений';let g=document.getElementById('grid');if(!list.length){g.innerHTML='<div class="empty">Ничего не найдено. Попробуй другой запрос или добавь приложение.</div>';return}g.innerHTML=list.map(a=>'<article class="card glass"><a href="'+esc(a.url)+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc(a.name)+'"></a><div class="cardactions"><button class="iconbtn edit" data-id="'+esc(a.id)+'" title="Изменить">✎</button><button class="iconbtn del" data-id="'+esc(a.id)+'" title="Удалить">×</button></div><div class="appicon">'+esc(a.icon||'🚀')+'</div><div class="appname">'+esc(a.name)+'</div><div class="cat">'+esc(a.category||'Другое')+'</div></article>').join('');document.querySelectorAll('.edit').forEach(b=>b.onclick=e=>{e.preventDefault();openForm(b.dataset.id)});document.querySelectorAll('.del').forEach(b=>b.onclick=e=>{e.preventDefault();removeApp(b.dataset.id)})}
function openForm(id){let a=apps.find(x=>x.id===id);document.getElementById('form').reset();document.getElementById('id').value=a?.id||'';document.getElementById('name').value=a?.name||'';document.getElementById('url').value=a?.url||'';document.getElementById('category').value=a?.category||'Инструменты';chosen=a?.icon||'🚀';document.getElementById('formtitle').textContent=a?'Изменить приложение':'Новое приложение';document.getElementById('emojis').innerHTML=icons.map(i=>'<button type="button" class="emoji '+(i===chosen?'selected':'')+'" data-icon="'+i+'">'+i+'</button>').join('');document.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>{chosen=b.dataset.icon;document.querySelectorAll('[data-icon]').forEach(x=>x.classList.toggle('selected',x===b))});document.getElementById('backdrop').classList.add('open')}
function closeForm(){document.getElementById('backdrop').classList.remove('open')}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function removeApp(id){let a=apps.find(x=>x.id===id);if(a&&confirm('Удалить «'+a.name+'»?')){apps=apps.filter(x=>x.id!==id);save();render();toast('Приложение удалено')}}
document.getElementById('add').onclick=()=>openForm();document.getElementById('cancel').onclick=closeForm;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')closeForm()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm();if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('query').focus()}});
document.getElementById('form').onsubmit=e=>{e.preventDefault();let id=document.getElementById('id').value,name=document.getElementById('name').value.trim(),url=safeUrl(document.getElementById('url').value);if(!url){toast('Введи корректную ссылку http или https');return}let a={id:id||'app-'+Date.now(),name,url,category:document.getElementById('category').value,icon:chosen};apps=id?apps.map(x=>x.id===id?a:x):[...apps,a];save();closeForm();render();toast(id?'Изменения сохранены':'Приложение добавлено')};
document.getElementById('query').oninput=e=>{q=e.target.value;render()};
document.getElementById('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(apps,null,2)],{type:'application/json'}));a.href=u;a.download='my-portal-backup.json';a.click();URL.revokeObjectURL(u);toast('Резервная копия скачана')};
document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d)||d.some(a=>!a.name||!safeUrl(a.url)))throw Error();apps=d.map((a,i)=>({id:String(a.id||'import-'+Date.now()+'-'+i),name:String(a.name).slice(0,50),url:safeUrl(a.url),category:String(a.category||'Другое'),icon:String(a.icon||'🚀')}));save();active='Все';render();toast('Импортировано: '+apps.length)}catch{toast('Не удалось прочитать файл')}e.target.value=''};
document.getElementById('reset').onclick=()=>{if(confirm('Заменить текущий список стартовым набором?')){apps=seed.map(a=>({...a}));save();active='Все';q='';document.getElementById('query').value='';render();toast('Стартовый набор восстановлен')}};
function tick(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});document.getElementById('year').textContent=d.getFullYear()}tick();setInterval(tick,15000);render();
</script></body></html>
